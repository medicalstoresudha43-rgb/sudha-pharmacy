<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudha Pharmacy Hub – Inventory</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--tx:#14231f;--mu:#5f736d;--bd:#dbe4e1;--pr:#0b5cad;--pr2:#e3eefa;--rd:#c0392b;--rd2:#fbe9e7;--am:#b7791f;--am2:#fdf3dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#16211e;--tx:#e6f0ed;--mu:#93a8a1;--bd:#2a3a36;--pr:#5aa9ff;--pr2:#14283d;--rd:#ff7b6b;--rd2:#3a1f1b;--am:#f0b94d;--am2:#3a2f14}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#16211e;--tx:#e6f0ed;--mu:#93a8a1;--bd:#2a3a36;--pr:#5aa9ff;--pr2:#14283d;--rd:#ff7b6b;--rd2:#3a1f1b;--am:#f0b94d;--am2:#3a2f14}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(90deg,#0b4f9e,#2e8b2e);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:200px}header small{display:block;font-weight:400;opacity:.85;font-size:12px}
nav{display:flex;gap:4px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;cursor:pointer;font-size:14px;white-space:nowrap}
nav button.on{background:var(--pr2);color:var(--pr);font-weight:600}
main{padding:14px;max-width:1150px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.k{color:var(--mu);font-size:12px}.v{font-size:22px;font-weight:700;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;font-size:14px;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:8px}label input,label select{display:block;width:100%;margin-top:3px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:14px}
.btn.g{background:var(--pr2);color:var(--pr)}.btn.d{background:var(--rd2);color:var(--rd)}.btn.s{padding:4px 9px;font-size:12px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd)}
th{font-size:12px;color:var(--mu);font-weight:600;background:var(--bg)}tr:last-child td{border:0}.r{text-align:right}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600}
.ok{background:var(--pr2);color:var(--pr)}.lo{background:var(--am2);color:var(--am)}.ex{background:var(--rd2);color:var(--rd)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h3{margin:0 0 8px;font-size:15px}.mu{color:var(--mu)}.empty{padding:18px;text-align:center;color:var(--mu)}
#md{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#md>div{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#lg{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}#lg .card{width:100%;max-width:380px;text-align:center}.seg{display:flex;gap:6px;margin:12px 0}.seg button{flex:1}.err{color:var(--rd);min-height:18px;font-size:13px}
.tw td input,.tw td select{padding:5px 6px;font-size:13px}
.sg{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}.sg:hover,.sg.act{background:var(--pr2)}.sg.dis{opacity:.5;cursor:not-allowed}#sg{border:1px solid var(--bd);border-radius:10px;background:var(--card);max-height:320px;overflow:auto;margin-bottom:8px}#sg:empty{display:none}
#tt{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:340px}.ts{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:10px;padding:10px 12px;box-shadow:0 4px 14px #0003;cursor:pointer}.ts.s1{border-left-color:var(--am)}.ts.s2,.ts.s3{border-left-color:var(--rd)}.ts.s4{border-left-color:#2e8b2e}
@media print{header,nav,.bar,.noprint{display:none!important}#md{position:static;background:none}}
</style></head><body>

function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items)throw 0;DB=d;ensure().then(()=>{ME=DB.users.find(u=>u.id===ME?.id)||null;logA('Restored backup');render()})}catch(e){alert('Invalid backup file')}};r.readAsText(f)}

const CAN={admin:['dash','inv','bill','sale','bot','buy','sup','rep','usr'],employee:['dash','inv','bill','sale','bot']};
let ME=null,LR='admin',fails=0,lockT=0;const isA=()=>ME?.role==='admin';
const logA=a=>{DB.log=(DB.log||[]).concat({t:new Date().toISOString(),u:ME?.username||'-',a}).slice(-300)};
async function H(p,s){const x=s+':'+p;if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x));return[...new Uint8Array(b)].map(v=>v.toString(16).padStart(2,'0')).join('')}let k=5381;for(const c of x)k=((k<<5)+k+c.charCodeAt(0))|0;return'f'+k}
async function ensure(){if(!DB.users||!DB.users.length){const mk=async(u,n,r,p)=>{const salt=uid();return{id:uid(),username:u,name:n,role:r,salt,hash:await H(p,salt),def:true}};DB.users=[await mk('admin','Store Admin','admin','admin123'),await mk('employee','Counter Staff','employee','emp123')]}DB.log=DB.log||[];DB.pinv=DB.pinv||[];DB.sinv=DB.sinv||[];DB.cust=DB.cust||[];DB.coll=DB.coll||[];DB.cfg=DB.cfg||{voice:true,lang:'en-IN'}}
const banner=()=>isA()&&DB.users.some(u=>u.def)?'<div class="card" style="margin-bottom:12px;border-color:var(--am);background:var(--am2)">⚠ Default passwords are still active. Open <b>Users &amp; Activity</b> to reset them.</div>':'';
function showLogin(){$('#lg').style.display='flex';setRole(LR)}
function setRole(r){LR=r;$('#rA').className='btn'+(r==='admin'?'':' g');$('#rE').className='btn'+(r==='employee'?'':' g');$('#le').textContent=''}
async function doLogin(){const now=Date.now();if(now<lockT)return $('#le').textContent='Too many attempts. Wait '+Math.ceil((lockT-now)/1000)+'s';
const u=DB.users.find(x=>x.username===$('#lu').value.trim().toLowerCase()&&x.role===LR);
if(u&&await H($('#lp').value,u.salt)===u.hash){fails=0;ME=u;try{sessionStorage.setItem('sph_me',u.id)}catch(e){}$('#lg').style.display='none';$('#lu').value='';$('#lp').value='';view='dash';logA('Signed in');render()}
else{if(++fails>=5){fails=0;lockT=now+30000}$('#le').textContent='Invalid username, password or role'}}

const blank=()=>({name:'',company:'',pack:'',hsn:'',batch:'',exp:'',qty:1,mrp:'',rate:'',disc:0,gst:5});
let PH={sup:'',no:'',date:today(),paid:0},PL=[blank()];
const lt=l=>{const g=(+l.qty||0)*(+l.rate||0),t=g*(1-(+l.disc||0)/100);return{g,t,gst:t*(+l.gst||0)/100}};
const eom=v=>{const[y,m]=v.split('-');return new Date(Date.UTC(+y,+m,0)).toISOString().slice(0,10)};
const due=n=>(DB.pinv||[]).filter(p=>p.sup===n).reduce((s,p)=>s+p.tot-p.paid,0);
function totals(){let g=0,t=0,x=0;PL.forEach(l=>{const r=lt(l);g+=r.g;t+=r.t;x+=r.gst});const raw=t+x,tot=Math.round(raw);return{g,disc:g-t,t,x,ro:tot-raw,tot}}

function plain(h){const e=document.createElement('div');e.innerHTML=h.replace(/<br\s*\/?>/g,'. ').replace(/<\/(div|span|b)>/g,'$& ');e.querySelectorAll('button').forEach(b=>b.remove());const t=e.textContent.replace(/₹\s?([\d,]+(\.\d+)?)/g,(m,n)=>n.replace(/,/g,'')+' rupees').replace(/[•✔🎉⛔🔻⏳❄🚫🔥📅💰🔔🔊]/gu,'').replace(/\s+/g,' ').trim();return t.length>380?t.slice(0,380).replace(/\s\S*$/,'')+'. Please check the screen for the rest.':t}
function say(t){
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){
    toast('Voice output is not supported in this browser. Please use current Chrome or Edge.',1);return;
  }
  try{
    const l=(DB.cfg.lang||'en-IN').replace('_','-');
    const u=new SpeechSynthesisUtterance(String(t||''));
    u.lang=l;u.rate=.88;u.pitch=1;u.volume=1;
    const chooseVoice=()=>{
      const voices=window.speechSynthesis.getVoices()||[];
      const lang2=l.slice(0,2).toLowerCase();
      let pv=voices.find(x=>x.lang.replace('_','-').toLowerCase()===l.toLowerCase());
      if(!pv)pv=voices.find(x=>x.lang.replace('_','-').toLowerCase().startsWith(lang2+'-'));
      if(!pv&&lang2==='hi')pv=voices.find(x=>/hindi|हिन्दी/i.test(x.name+' '+x.lang));
      if(pv)u.voice=pv;
      u.lang=pv?(pv.lang.replace('_','-')):l;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    };
    if(window.speechSynthesis.getVoices().length) chooseVoice();
    else {
      let done=false;
      const run=()=>{if(done)return;done=true;window.speechSynthesis.removeEventListener?.('voiceschanged',run);chooseVoice();};
      window.speechSynthesis.addEventListener?.('voiceschanged',run);
      setTimeout(run,700);
    }
  }catch(e){toast('Could not start voice. Check browser sound and installed Hindi voices.',1);}
}

function aiContext(q){const A=isA(),I=DB.items,m=new Set(findMeds(norm(q)).map(i=>i.id)),al=alerts(),as=new Set(al.map(a=>a.i.id));let L=I;if(I.length>300)L=I.filter(i=>m.has(i.id)||as.has(i.id)).concat(I.filter(i=>!m.has(i.id)&&!as.has(i.id)).sort((a,b)=>sold30(b.name)-sold30(a.name)).slice(0,100));

async function askAI(q,hist){const c=aiCfg();if(!hist){hist=[];BOT.filter(m=>m.t).slice(-9,-1).forEach(m=>{const r=m.r==='u'?'user':'assistant',l=hist[hist.length-1];if(l&&l.role===r)l.content+='\n'+m.t;else hist.push({role:r,content:m.t})});while(hist.length&&hist[0].role!=='user')hist.shift();if(hist.length&&hist[hist.length-1].role==='user')hist.pop()}
